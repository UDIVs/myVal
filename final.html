<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>It’s a date 💖</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle, #ffeef6, #ffd6e7);
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    .card {
      background: white;
      padding: 32px;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.18);
      max-width: 560px;
      margin: 16px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>YAYYY 🎉💖</h1>

    <img
      src="https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif"
      alt="Fireworks"
      style="width:240px; margin:14px auto;"
    />

    <p style="font-size:18px;">
      I’m so excited 🥹💘  
      Thank you for making me the happiest person today.
    </p>

    <p style="margin-top:12px; opacity:.75;">
      Now get ready… our date is coming 😏🌹
    </p>
  </div>
</body>
</html>
